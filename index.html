<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Sort – Step-by-Step Animation</title>
<style>
:root{--bg:#fff;--fg:#1a1a2e;--mut:#666;--card:#f3f5fa;--bd:#d5dae6;--navy:#1F3864;
--norm:#8fa8d6;--out:#d3d7e0;--piv:#d62839;--less:#2a9d8f;--scan:#f4a300;--done:#3a9e4f}
@media (prefers-color-scheme:dark){:root{--bg:#15171f;--fg:#e8eaf2;--mut:#9aa0b4;--card:#1e212c;--bd:#33384a;--navy:#8fb0ee;
--norm:#5a74a8;--out:#3a3f50;--piv:#ef5b6b;--less:#3cb8a8;--scan:#f4b73a;--done:#4cb862}}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:900px;margin:auto}
h1{font-size:1.25rem;margin:0 0 4px;color:var(--navy)}
p.sub{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-size:.82rem;color:var(--mut)}
input[type=text]{flex:1;min-width:200px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font-family:monospace}
select,button{padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font-size:.9rem;cursor:pointer}
button.pri{background:var(--navy);color:var(--bg);border-color:var(--navy)}
button:disabled{opacity:.45;cursor:default}
#stage{height:300px;display:flex;align-items:flex-end;gap:3px;padding:8px 4px 0;position:relative}
.bar{flex:1;min-width:6px;border-radius:4px 4px 0 0;position:relative;transition:height .15s,background .15s}
.bar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--fg)}
.idx{display:flex;gap:3px;padding:2px 4px;font-size:.68rem;color:var(--mut)}
.idx div{flex:1;min-width:6px;text-align:center;height:14px;font-weight:600}
#msg{min-height:3.2em;font-size:1rem;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.stats{display:flex;gap:18px;font-size:.88rem;flex-wrap:wrap}
input[type=range]{vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quick Sort: step-by-step animation</h1>
  <p class="sub">Lomuto partition. Enter your own array, pick a pivot rule, then play or step through.</p>

  <div class="panel">
    <div class="row">
      <label for="arr">Array (comma separated, 2&ndash;30 numbers)</label>
      <input type="text" id="arr" value="38, 27, 43, 3, 9, 82, 10">
    </div>
    <div class="row" style="margin-top:8px">
      <button id="load" class="pri">Load array</button>
      <button id="rand">Random array</button>
      <label>Size <input type="range" id="size" min="5" max="30" value="12"> <b id="sizev">12</b></label>
      <label>Pivot
        <select id="rule">
          <option value="last">Last element</option>
          <option value="first">First element</option>
          <option value="median">Median of three</option>
          <option value="random">Random</option>
        </select>
      </label>
    </div>
  </div>

  <div class="panel">
    <div id="stage"></div>
    <div class="idx" id="idx"></div>
    <div class="legend" style="margin-top:8px">
      <span><i style="background:var(--piv)"></i>pivot</span>
      <span><i style="background:var(--less)"></i>&le; pivot (left region)</span>
      <span><i style="background:var(--scan)"></i>being compared (j)</span>
      <span><i style="background:var(--norm)"></i>unprocessed in current range</span>
      <span><i style="background:var(--out)"></i>outside current range</span>
      <span><i style="background:var(--done)"></i>final position</span>
    </div>
  </div>

  <div class="panel">
    <div id="msg"></div>
    <div class="stats">
      <span>Step: <b id="st">0</b> / <b id="tot">0</b></span>
      <span>Comparisons: <b id="cmp">0</b></span>
      <span>Swaps: <b id="swp">0</b></span>
      <span>Current range: <b id="rng">&ndash;</b></span>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="first">&#9198;</button>
      <button id="prev">&#9664; Back</button>
      <button id="play" class="pri">&#9654; Play</button>
      <button id="next">Step &#9654;</button>
      <button id="last">&#9197;</button>
      <label>Speed <input type="range" id="speed" min="1" max="10" value="5"></label>
    </div>
    <input type="range" id="scrub" min="0" max="0" value="0" style="width:100%;margin-top:8px">
  </div>
</div>

<script>
let steps = [], cur = 0, timer = null;
const $ = id => document.getElementById(id);

/* ---------- Build the list of snapshots by running Quick Sort once ---------- */
function buildSteps(input, rule){
  const a = input.slice(), out = [], done = new Set();
  let cmp = 0, swp = 0;
  const snap = (msg, o = {}) => out.push({a: a.slice(), done: [...done], cmp, swp, msg,
      lo: o.lo ?? -1, hi: o.hi ?? -1, p: o.p ?? -1, i: o.i ?? -2, j: o.j ?? -1});
  const swap = (x, y) => { if (x !== y){ [a[x], a[y]] = [a[y], a[x]]; swp++; } };
  const pick = (lo, hi) => {
    if (rule === 'first') return lo;
    if (rule === 'random') return lo + Math.floor(Math.random() * (hi - lo + 1));
    if (rule === 'median'){
      const m = (lo + hi) >> 1, c = [[a[lo], lo], [a[m], m], [a[hi], hi]].sort((u, v) => u[0] - v[0]);
      return c[1][1];
    }
    return hi;
  };
  snap('Start: the array is unsorted. Quick Sort will pick a pivot, partition around it, then recurse.');
  (function qs(lo, hi){
    if (lo > hi) return;
    if (lo === hi){ done.add(lo); snap(`Range [${lo}..${hi}] has one element (${a[lo]}); it is already in place.`, {lo, hi}); return; }
    const k = pick(lo, hi);
    if (k !== hi){ const was = a[k]; swap(k, hi); snap(`Pivot rule "${rule}" chose ${was} (index ${k}); swap it to the end of the range.`, {lo, hi, p: hi}); }
    const pv = a[hi]; let i = lo - 1;
    snap(`Partition range [${lo}..${hi}] with pivot = ${pv}. Left region (i) starts empty.`, {lo, hi, p: hi, i});
    for (let j = lo; j < hi; j++){
      cmp++;
      if (a[j] <= pv){
        i++; const same = (i === j); swap(i, j);
        snap(`${a[i]} \u2264 ${pv}: grow the left region${same ? ' (already in position)' : ` and swap a[${i}] with a[${j}]`}.`, {lo, hi, p: hi, i, j});
      } else {
        snap(`${a[j]} > ${pv}: leave it on the right side and move j forward.`, {lo, hi, p: hi, i, j});
      }
    }
    swap(i + 1, hi); const p = i + 1; done.add(p);
    snap(`Scan finished. Swap pivot ${pv} into index ${p}: everything left of it is \u2264 ${pv}, everything right is larger. Pivot is now in its final position.`, {lo, hi, p});
    qs(lo, p - 1); qs(p + 1, hi);
  })(0, a.length - 1);
  done.clear(); a.forEach((_, x) => done.add(x));
  snap('Sorted! Every element has reached its final position.');
  return out;
}

/* ---------- Rendering ---------- */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v); }
function render(){
  const s = steps[cur]; if (!s) return;
  const n = s.a.length, mx = Math.max(...s.a, 1), st = $('stage'), ix = $('idx');
  st.innerHTML = ''; ix.innerHTML = '';
  const dn = new Set(s.done);
  s.a.forEach((v, x) => {
    let c = 'var(--out)';
    if (s.lo >= 0 && x >= s.lo && x <= s.hi) c = 'var(--norm)';
    if (s.i >= s.lo && s.lo >= 0 && x >= s.lo && x <= s.i) c = 'var(--less)';
    if (x === s.j) c = 'var(--scan)';
    if (dn.has(x)) c = 'var(--done)';
    if (x === s.p && !dn.has(x)) c = 'var(--piv)';
    const b = document.createElement('div');
    b.className = 'bar'; b.style.height = Math.max(6, (v / mx) * 270) + 'px'; b.style.background = c;
    if (n <= 20){ const t = document.createElement('span'); t.textContent = v; b.appendChild(t); }
    st.appendChild(b);
    const d = document.createElement('div');
    d.textContent = x === s.j ? 'j' : (x === s.i && s.i >= 0 ? 'i' : (n <= 20 ? x : ''));
    d.style.color = x === s.j ? 'var(--scan)' : (x === s.i ? 'var(--less)' : '');
    ix.appendChild(d);
  });
  $('msg').textContent = s.msg;
  $('st').textContent = cur; $('tot').textContent = steps.length - 1;
  $('cmp').textContent = s.cmp; $('swp').textContent = s.swp;
  $('rng').textContent = s.lo >= 0 ? `[${s.lo}..${s.hi}]` : '\u2013';
  $('scrub').value = cur;
  $('prev').disabled = $('first').disabled = cur === 0;
  $('next').disabled = $('last').disabled = cur === steps.length - 1;
}

/* ---------- Controls ---------- */
function stop(){ clearInterval(timer); timer = null; $('play').innerHTML = '&#9654; Play'; }
function go(k){ cur = Math.max(0, Math.min(steps.length - 1, k)); render(); }
function load(input){
  stop();
  steps = buildSteps(input, $('rule').value); cur = 0;
  $('scrub').max = steps.length - 1; render();
}
function parse(){
  const v = $('arr').value.split(/[\s,]+/).filter(Boolean).map(Number);
  if (v.length < 2 || v.length > 30 || v.some(x => !isFinite(x))){ alert('Enter 2 to 30 numbers separated by commas.'); return null; }
  return v;
}
function play(){
  if (timer) return stop();
  if (cur === steps.length - 1) cur = 0;
  $('play').innerHTML = '&#10074;&#10074; Pause';
  const tick = () => { if (cur >= steps.length - 1){ stop(); return; } go(cur + 1); };
  const delay = () => 1100 - $('speed').value * 100;
  timer = setInterval(tick, delay());
  $('speed').oninput = () => { if (timer){ clearInterval(timer); timer = setInterval(tick, delay()); } };
}
$('load').onclick = () => { const v = parse(); if (v) load(v); };
$('rand').onclick = () => {
  const n = +$('size').value;
  $('arr').value = Array.from({length: n}, () => 5 + Math.floor(Math.random() * 95)).join(', ');
  load(parse());
};
$('size').oninput = () => $('sizev').textContent = $('size').value;
$('rule').onchange = () => { const v = parse(); if (v) load(v); };
$('play').onclick = play;
$('next').onclick = () => { stop(); go(cur + 1); };
$('prev').onclick = () => { stop(); go(cur - 1); };
$('first').onclick = () => { stop(); go(0); };
$('last').onclick = () => { stop(); go(steps.length - 1); };
$('scrub').oninput = e => { stop(); go(+e.target.value); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
  if (e.key === ' ') { e.preventDefault(); play(); }
});
load(parse());
</script>
</body>
</html>
